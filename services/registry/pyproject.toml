[project]
name = "kb-registry"
version = "0.1.0"
description = "Documents, versions, categories, edges, ACL resolution, publish transaction (INV-5)"
requires-python = ">=3.12"
dependencies = [
    "kb-common",
    "kb-schemas",
    "kb-authz",
    "kb-ports",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "kb-indexer",
    # Reached transitively through kb-indexer until now, while `anchors`, `service` and the M9d
    # gates all import it directly. An undeclared dependency that happens to resolve is a
    # packaging bug waiting for the day the transitive path changes.
    "kb-vntext",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_registry"]

[tool.uv.sources]
kb-common = { workspace = true }
kb-schemas = { workspace = true }
kb-authz = { workspace = true }
kb-ports = { workspace = true }
kb-indexer = { workspace = true }
kb-vntext = { workspace = true }
