[project]
name = "kb-indexer"
version = "0.1.0"
description = "Chunker, embedder, index writers, outbox consumer"
requires-python = ">=3.12"
dependencies = [
    "kb-common",
    "kb-schemas",
    "kb-authz",
    "kb-ports",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pgvector>=0.3.2",
    "kb-vntext",
    "kb-idp",
    "kb-registry",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_indexer"]

[tool.uv.sources]
kb-common = { workspace = true }
kb-schemas = { workspace = true }
kb-authz = { workspace = true }
kb-ports = { workspace = true }
kb-vntext = { workspace = true }
kb-idp = { workspace = true }
kb-registry = { workspace = true }
