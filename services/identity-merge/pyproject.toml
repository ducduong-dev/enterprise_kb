[project]
name = "kb-identity-merge"
version = "0.1.0"
description = "Legal-number extraction, matching layers, section diff, LLM merge draft"
requires-python = ">=3.12"
dependencies = [
    "kb-common",
    "kb-schemas",
    "kb-authz",
    "kb-ports",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "kb-vntext",
    "kb-registry",
    "kb-idp",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_identity_merge"]

[tool.uv.sources]
kb-common = { workspace = true }
kb-schemas = { workspace = true }
kb-authz = { workspace = true }
kb-ports = { workspace = true }
kb-vntext = { workspace = true }
kb-registry = { workspace = true }
kb-idp = { workspace = true }
