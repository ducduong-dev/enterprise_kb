[project]
name = "kb-portal-api"
version = "0.1.0"
description = "Upload, review tasks, merge screens, approvals, admin"
requires-python = ">=3.12"
dependencies = [
    "kb-common",
    "kb-schemas",
    "kb-authz",
    "kb-ports",
    "kb-clients",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "temporalio>=1.7",
    "kb-registry",
    "kb-workflows",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_portal_api"]

[tool.uv.sources]
kb-common = { workspace = true }
kb-schemas = { workspace = true }
kb-authz = { workspace = true }
kb-ports = { workspace = true }
kb-clients = { workspace = true }
kb-registry = { workspace = true }
kb-workflows = { workspace = true }
