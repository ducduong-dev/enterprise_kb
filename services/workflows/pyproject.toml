[project]
name = "kb-workflows"
version = "0.1.0"
description = "Temporal workflow and activity definitions (ingest, review, merge, publish)"
requires-python = ">=3.12"
dependencies = [
    "kb-common",
    "kb-schemas",
    "kb-authz",
    "kb-ports",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "temporalio>=1.7",
    "kb-idp",
    "kb-registry",
    "kb-pii-gate",
    "kb-identity-merge",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_workflows"]

[tool.uv.sources]
kb-common = { workspace = true }
kb-schemas = { workspace = true }
kb-authz = { workspace = true }
kb-ports = { workspace = true }
kb-idp = { workspace = true }
kb-registry = { workspace = true }
kb-pii-gate = { workspace = true }
kb-identity-merge = { workspace = true }
