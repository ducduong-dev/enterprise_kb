[project]
name = "kb-chat-api"
version = "0.1.0"
description = "Query condensation, context assembly, generation, output filter, citations"
requires-python = ">=3.12"
dependencies = [
    "kb-common",
    "kb-schemas",
    "kb-authz",
    "kb-ports",
    "kb-clients",
    "kb-pii-gate",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_chat_api"]

[tool.uv.sources]
kb-common = { workspace = true }
kb-schemas = { workspace = true }
kb-authz = { workspace = true }
kb-ports = { workspace = true }
kb-clients = { workspace = true }
kb-pii-gate = { workspace = true }
