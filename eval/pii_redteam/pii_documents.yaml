# Forty documents that must never be published (M4 acceptance criterion).
#
# Each is a plausible thing someone actually uploads to a knowledge base: a complaint file, a
# branch's customer list pasted into a procedure, a training deck built from a real account, a
# scanned form. If the gate lets one of these through, a customer's identity reaches everyone
# with a search box.
#
# `expect: block` is the assertion. `kind` records which rule ought to catch it — the tests do
# not require that exact rule to fire (defence in depth is the point), but a change that shifts
# a document from one rule to another is worth seeing in a diff.

