# Forty documents that must publish without a reviewer being asked (M4 acceptance criterion).
#
# These are not easy cases. They are the ones a careless gate blocks: regulatory text full of
# instrument numbers, fee tables full of amounts, management reports full of long numbers,
# procedures that name bank staff, and worked examples that are explicitly hypothetical.
#
# A gate that blocks these is worse than useless. Reviewers learn that the block means nothing,
# start overriding on reflex, and the one document that mattered goes through with the rest.
# Every entry here exists because some plausible rule would have caught it.

