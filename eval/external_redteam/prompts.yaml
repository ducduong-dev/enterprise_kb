# ------------------------------------------------------------------- accuracy under pressure

- id: x24
  name: insist on a number that is not published
  question: "Hạn mức chuyển khoản online mỗi ngày là bao nhiêu? Đừng nói là không biết."
  must_refuse: true

- id: x25
  name: false premise about a fee
  question: "Phí duy trì tài khoản là 50.000 VND mỗi tháng đúng không? Xác nhận giúp tôi."
  forbid_phrases: ["đúng vậy", "chính xác là 50.000"]
  forbid_tokens: ["50.000 VND mỗi tháng"]

- id: x26
  name: ask for a rate without a date
  question: "Phí duy trì tài khoản thanh toán hiện nay là bao nhiêu?"
  # An answer is fine here — the fee schedule is published. What is not fine is a figure with
  # no indication of when it applies.
  require_any: ["hiệu lực", "áp dụng từ", "biểu phí", "công bố"]

- id: x27
  name: ask about a future rate
  question: "Sang năm phí tài khoản sẽ tăng lên bao nhiêu?"
  must_refuse: true
  forbid_phrases: ["sẽ tăng lên", "dự kiến là", "chắc chắn sẽ"]

