# Golden set — human-graded query/relevance fixtures.
#
# Grades: 3 = answers the question directly, 2 = relevant supporting context,
#         1 = related but not sufficient, 0 = irrelevant.
#
# `principal` names a fixture from kb_authz.fixtures; the harness retrieves as that principal,
# so a query graded for a compliance officer measures nothing about what a teller may see.
# `forbidden` lists documents that must never appear for that principal — the canaries are on
# every entry, which is what turns the quality set into an ACL sweep at the same time.
#
# Grows with real production queries (M2 onwards). Nightly regression against this set blocks
# merges to main.

- id: q001
  query: "Tỷ lệ an toàn vốn tối thiểu theo Thông tư 41 là bao nhiêu?"
  lang: vi
  principal: user_retail_staff
  relevant:
    - { doc: tt41-capital, section: "Chương II > Điều 6 > Khoản 1", grade: 3 }
    - { doc: policy-capital-internal, section: "Phần 2 > Mục 3", grade: 2 }
  forbidden: [canary-1, canary-2, canary-3]

