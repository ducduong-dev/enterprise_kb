# Answer set — 60 questions, graded for faithfulness rather than for relevance (M6 acceptance).
#
# The golden set (eval/golden_set) asks "did retrieval find the right documents?". This set
# asks the question that comes after: "given what retrieval found, is the answer defensible?"
#
# Each entry declares what a defensible answer looks like:
#
#   expect: answer   — the corpus contains the basis, so the bot must answer *and* cite it.
#           refusal  — it does not, so the bot must say so. A fluent answer here is a failure,
#                      even a correct-sounding one: it was not grounded in anything.
#   must_cite:       — instruments that would answer the question; citing at least one of them
#                      is required. Several seeded documents legitimately answer the same
#                      question (a regulation and the internal policy implementing it), and
#                      citing either is defensible.
#   requires:        — a capability the deterministic CI stack does not have. `semantic` means
#                      the match is cross-lingual or paraphrase-only, which the hashed
#                      embedding cannot see; `model` means deciding to refuse takes judgement
#                      the extractive adapter has no way to exercise. These are reported as
#                      *not measured* rather than scored, so a green CI run never implies a
#                      capability that was never exercised.
#   forbidden:       — documents that must never be cited for this principal. The three
#                      canaries are on every entry, which makes this an ACL sweep as well.
#
# `principal` names a fixture from kb_authz.fixtures. The same question asked by two people is
# two different questions here — that is the point of several entries below.
#
# Scoring lives in eval/harness/answers.py; the gate is tests/test_chat_quality.py.

