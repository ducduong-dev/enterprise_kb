# DMZ gateway — the only thing the internet talks to.
#
# Everything here is a limit. The bot behind it is already scoped server-side (INV-4) and
# filters its own output (INV-7); this layer exists so that an attacker cannot reach the parts
# of the platform that were never meant to be public, and cannot spend the bank's GPU budget.
#
# Deliberately *not* an authentication layer: the token is minted by the bank's public channel
# and verified by chat-api against Keycloak. A gateway that authenticated on the service's
# behalf would be a second place where identity is decided.

worker_processes auto;
events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Per-IP request budget. The in-process limiter in chat-api counts per *principal*, which
    # is the right unit for fairness and the wrong one for a flood: one stolen token behind a
    # botnet is one principal. Both exist because they answer different questions.
    limit_req_zone $binary_remote_addr zone=external:10m rate=20r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conns:10m;

    # A question is a sentence. Anything larger is either a mistake or an attempt to put a
    # document into the prompt.
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;

    server_tokens off;

    upstream dmz_chat {
        server dmz-chat-api:8000;
    }

    server {
        listen 8080;
        server_name _;

        # Headers a public endpoint should always set, and none it should not.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store" always;

        # The allow-list is the point of this file: one method, one path. `/v1/chat/internal`
        # is not routed here at all — the internal surface is not merely refused by policy on
        # the public edge, it is unreachable.
        location = /v1/chat/external {
            limit_except POST { deny all; }
            limit_req zone=external burst=5 nodelay;
            limit_conn conns 8;

            proxy_pass http://dmz_chat;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # The delegation header belongs to the internal bot (INV-3). Stripping it here
            # means a public caller cannot even attempt to name a user to act for.
            proxy_set_header X-KB-On-Behalf-Of "";
            proxy_read_timeout 60s;
        }

        location = /healthz {
            proxy_pass http://dmz_chat;
            access_log off;
        }

        location / {
            return 404;
        }
    }
}
