# The portal's origin, and the whole stack's.
#
# Everything a browser needs is served from here: the bundle, the API under /api, and Keycloak
# under its own /realms and /resources paths. That is not tidiness — it is what makes the stack
# usable through a single forwarded port (VS Code, a jump host, a codespace) and what removes
# cross-origin from the picture entirely. Publishing 8008 and 8080 as well is for curl and the
# admin console, not for the browser.
#
# Two things a single-page app needs from its server and does not get by default: every route
# falls back to index.html (a refresh on /review/<task-id> is otherwise a 404 that never
# reaches the router), and the hashed assets are cached while index.html never is — otherwise
# a deploy leaves browsers holding a stale entry point that references files that no longer
# exist.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Chat is the one API path that is not portal-api's. chat-api is a *peer* front door, not
    # something behind the portal: it verifies the caller itself and exchanges the token before
    # retrieving (INV-2/INV-3), so proxying it through portal-api would put a second identity in
    # the middle of that exchange. It stays same-origin here for the same reason everything else
    # does — one forwarded port, no CORS — and nginx prefers this longer prefix over /api/.
    location /api/v1/chat/ {
        proxy_pass http://chat-api:8000/v1/chat/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # An answer waits on retrieval and a generation model.
        proxy_read_timeout 120s;
    }

    # The API. The trailing slashes matter: /api/v1/x → http://portal-api:8000/v1/x.
    location /api/ {
        proxy_pass http://portal-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # An upload is a document, not a form field.
        client_max_body_size 200m;
        proxy_read_timeout 120s;
    }

    # Keycloak keeps its own paths, so the issuer is <this origin>/realms/kb and the tokens it
    # mints verify against the same URL the browser signed in at. /resources and /js are the
    # login page's own assets.
    location ~ ^/(realms|resources|js)/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
