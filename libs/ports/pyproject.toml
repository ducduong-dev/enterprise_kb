[project]
name = "kb-ports"
version = "0.1.0"
description = "Port interfaces for storage, indexes and models (INV-12)"
requires-python = ">=3.12"
dependencies = [
    "kb-common",
    "kb-schemas",
    "kb-vntext",
    "kb-authz",
    "pydantic>=2.9",
    "boto3>=1.35",
    "httpx>=0.27",
    "sqlalchemy>=2.0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_ports"]

[tool.uv.sources]
kb-common = { workspace = true }
kb-schemas = { workspace = true }
kb-vntext = { workspace = true }
kb-authz = { workspace = true }
