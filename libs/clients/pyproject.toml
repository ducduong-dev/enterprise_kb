[project]
name = "kb-clients"
version = "0.1.0"
description = "Typed clients for internal services — the retrieval funnel (INV-1)"
requires-python = ">=3.12"
dependencies = ["kb-common", "kb-schemas", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_clients"]

[tool.uv.sources]
kb-common = { workspace = true }
kb-schemas = { workspace = true }
