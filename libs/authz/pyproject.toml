[project]
name = "kb-authz"
version = "0.1.0"
description = "Token verification, principal resolution, FilterBuilder (INV-2/3/4)"
requires-python = ">=3.12"
dependencies = [
    "kb-common",
    "kb-schemas",
    "pydantic>=2.9",
    "pyjwt[crypto]>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_authz"]

[tool.uv.sources]
kb-common = { workspace = true }
kb-schemas = { workspace = true }
