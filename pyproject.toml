[project]
name = "kb-platform"
version = "0.1.0"
description = "Enterprise Knowledge Base Platform (banking profile) — monorepo root"
requires-python = ">=3.12"
dependencies = [
    "kb-common",
    "kb-schemas",
    "kb-authz",
    "kb-ports",
    "kb-vntext",
    "kb-registry",
    "kb-idp",
    "kb-pii-gate",
    "kb-identity-merge",
    "kb-indexer",
    "kb-retrieval-api",
    "kb-chat-api",
    "kb-portal-api",
    "kb-workflows",
]

[dependency-groups]
dev = [
    "alembic>=1.13",
    "pgvector>=0.3.2",
    "pyyaml>=6.0",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "httpx>=0.27",
]

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[tool.uv.sources]
kb-common = { workspace = true }
kb-schemas = { workspace = true }
kb-clients = { workspace = true }
kb-authz = { workspace = true }
kb-ports = { workspace = true }
kb-vntext = { workspace = true }
kb-registry = { workspace = true }
kb-idp = { workspace = true }
kb-pii-gate = { workspace = true }
kb-identity-merge = { workspace = true }
kb-indexer = { workspace = true }
kb-retrieval-api = { workspace = true }
kb-chat-api = { workspace = true }
kb-portal-api = { workspace = true }
kb-workflows = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["ops/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]
# Every workspace package's source root, so a module has exactly one name whether it is
# reached as an import or passed as a file argument.
mypy_path = """
libs/common/src:libs/schemas/src:libs/authz/src:libs/ports/src:libs/vntext/src:\
libs/clients/src:\
services/registry/src:services/idp/src:services/pii-gate/src:services/identity-merge/src:\
services/indexer/src:services/retrieval-api/src:services/chat-api/src:\
services/portal-api/src:services/workflows/src\
"""
exclude = ["ops/alembic/versions/.*", "^build/"]

# Vendor libraries without type information. Our adapters are typed at their own boundary,
# which is the point of the ports: an untyped client is confined to one module.
[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "botocore.*",
    "openpyxl.*",
    "docx.*",
    "pptx.*",
    "pymupdf.*",
    "paddleocr.*",
]
ignore_missing_imports = true

# PyMuPDF ships type information but leaves most methods unannotated. Confined to the two
# modules that touch it.
[[tool.mypy.overrides]]
module = [
    "kb_idp.parsers.pdf_native",
    "kb_idp.ocr_pipeline",
    "kb_idp.testing.make_pdfs",
    "kb_idp.testing.make_scans",
]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["libs", "services", "tests", "eval"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires live infrastructure (postgres, and object storage for some)",
    "acl_sweep: blocking ACL invariant sweep (INV-2/3/4/10)",
]
